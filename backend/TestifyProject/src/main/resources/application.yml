spring:
  application:
    name: TestifyProject
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      database: 0
      host: localhost
      port: 6379
      password:
      timeout: 60000

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:Testify}
    access-token-minutes: ${JWT_AT_MIN:60}
    refresh-token-days: ${JWT_RT_DAYS:7}
