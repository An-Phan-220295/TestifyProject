name: Testify Project

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 220295
          POSTGRES_DB: testify
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "oracle"
          cache: maven

      - name: Wait for PostgreSQL and Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client redis-tools
          echo "⏳ Waiting for PostgreSQL..."
          until pg_isready -h localhost -p 5432 -U postgres; do
            sleep 2
          done
          echo "✅ PostgreSQL is ready!"
          echo "⏳ Waiting for Redis..."
          until redis-cli -h localhost -p 6379 ping | grep PONG; do
            sleep 2
          done
          echo "✅ Redis is ready!"

      - name: Build with Maven
        working-directory: backend/TestifyProject
        env:
          # Database
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testify
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: 220295

          # Redis
          SPRING_DATA_REDIS_DATABASE: 0
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          SPRING_DATA_REDIS_TIMEOUT: 60000

          # JWT
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ISSUER: "Testify CI"
          JWT_AT_MIN: 60
          JWT_RT_DAYS: 7

          # AWS (mapping trực tiếp theo application.yml)
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

        run: mvn -B clean install

      - name: Run tests
        working-directory: backend/TestifyProject
        env:
          # Database
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testify
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: 220295

          # Redis
          SPRING_DATA_REDIS_DATABASE: 0
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          SPRING_DATA_REDIS_TIMEOUT: 60000

          # JWT
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ISSUER: "Testify CI"
          JWT_AT_MIN: 60
          JWT_RT_DAYS: 7

          # AWS (mapping chuẩn y nguyên từ application.yml)
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

        run: mvn -B test
